# MyBrain: refresh this repository's map on every push (free, no AI).
# It builds the code map with MyBrain and publishes it to your MyBrain app.
#
# Needs one repository secret: MYBRAIN_MAPS_TOKEN
#   (a GitHub token that can write to your private mybrain-maps repository;
#    see https://github.com/Vicevinnybeats/MyBrain#part-3-maps-that-update-themselves)
name: MyBrain map

on:
  push:            # every push; the job below only runs for the default branch
  workflow_dispatch:

concurrency:
  group: mybrain-map
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  map:
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install MyBrain
        run: uv tool install "git+https://github.com/Vicevinnybeats/MyBrain"

      - name: Build the map (code only, free)
        run: mybrain update .

      - name: Publish to the MyBrain app
        env:
          MYBRAIN_MAPS_TOKEN: ${{ secrets.MYBRAIN_MAPS_TOKEN }}
          MYBRAIN_MAPS_REPO: ${{ vars.MYBRAIN_MAPS_REPO || 'Vicevinnybeats/mybrain-maps' }}
        run: |
          if [ -z "$MYBRAIN_MAPS_TOKEN" ]; then
            echo "::warning::Map built but not published: add the MYBRAIN_MAPS_TOKEN secret to this repository (Settings > Secrets and variables > Actions), then re-run."
            exit 0
          fi
          mybrain-publish . --name "${{ github.event.repository.name }}"
