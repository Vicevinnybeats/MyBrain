<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyBrain</title>
<meta name="description" content="Your code, as a living map.">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MyBrain">
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- ============ Home: list of maps ============ -->
<section id="home" class="view">
  <header class="home-head">
    <img src="icons/icon.svg" alt="" class="logo">
    <div class="grow">
      <h1>MyBrain</h1>
      <p class="tag">Brain Monitor <span id="live" class="live" title="Refreshes by itself"><i></i><span id="live-text">live</span></span></p>
    </div>
    <button id="add-btn" class="add-btn" aria-label="Add a project">+</button>
  </header>
  <div id="add-panel" class="modal" hidden role="dialog" aria-modal="true" aria-labelledby="add-title">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="add-title">Map a repository</h2>
        <button type="button" id="add-cancel" class="icon-btn" aria-label="Close">
          <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <p class="meta">Tap a repository. Its map appears in a few minutes and then updates itself every hour.</p>
      <form id="add-form" autocomplete="off">
        <input id="add-repo" type="search" inputmode="search" placeholder="Search your repositories" autocapitalize="off"
               autocorrect="off" spellcheck="false" enterkeyhint="search" aria-label="Search your repositories">
        <input id="add-key" type="password" placeholder="MyBrain key (once per device)" autocomplete="current-password" hidden aria-label="MyBrain key">
      </form>
      <p id="add-msg" class="meta add-msg"></p>
      <div id="repo-list" class="repo-list" role="list"></div>
    </div>
  </div>
  <div class="dash">
    <section class="panel vitals-panel" aria-labelledby="h-vitals">
      <h3 id="h-vitals" class="panel-h"><i class="pd cyan"></i>Brain vitals</h3>
      <div id="vitals" class="vitals"></div>
    </section>
    <section class="panel" aria-labelledby="h-now">
      <h3 id="h-now" class="panel-h"><i class="pd violet"></i>Activity <span id="now-count" class="panel-n"></span></h3>
      <div id="jobs" class="jobs" aria-live="polite"></div>
      <p id="now-empty" class="panel-empty">Quiet. No robot is mapping right now.</p>
    </section>
    <section class="panel" aria-labelledby="h-alerts">
      <h3 id="h-alerts" class="panel-h"><i class="pd red"></i>Alerts <span id="alert-count" class="panel-n"></span></h3>
      <div id="alerts" class="alerts" aria-live="polite"></div>
    </section>
    <section class="panel maps-panel" aria-labelledby="h-maps">
      <h3 id="h-maps" class="panel-h"><i class="pd green"></i>Maps <span id="map-count" class="panel-n"></span></h3>
      <div id="map-list" class="map-list" aria-live="polite"></div>
      <p id="home-empty" class="empty" hidden>
        No maps yet. Tap <b>+</b> and pick a repository.
      </p>
    </section>
  </div>
  <footer class="home-foot">
    <button id="install-btn" class="btn" hidden>Install app</button>
    <span id="version" class="muted"></span>
  </footer>
</section>

<!-- ============ Map view ============ -->
<section id="mapview" class="view" hidden>
  <canvas id="canvas" aria-label="Network map"></canvas>
  <canvas id="canvas3d" aria-label="3D brain map" hidden></canvas>
  <div id="labels3d" class="labels3d" aria-hidden="true"></div>

  <div class="topbar">
    <button id="back" class="icon-btn" aria-label="All maps">
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
    </button>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search neurons…" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="search"
             aria-label="Search neurons">
      <div id="results" class="results" role="listbox" hidden></div>
    </div>
    <button id="menu-lobes" class="icon-btn" aria-label="Lobes">
      <svg viewBox="0 0 24 24"><circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><circle cx="12" cy="17" r="3"/></svg>
    </button>
    <button id="menu-scan" class="icon-btn" aria-label="Brain Scan report">
      <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z M14 3v5h5 M9 12h7 M9 16h7" /></svg>
    </button>
  </div>

  <div id="map-title" class="map-title"></div>
  <div id="progress" class="progress" hidden><span></span><em>Growing neurons…</em></div>

  <div class="fabs">
    <button id="view3d" class="icon-btn" aria-label="Switch between 3D and 2D" title="3D / 2D"><b>3D</b></button>
    <button id="anim" class="icon-btn on" aria-label="Animation on/off" title="Firing signals">
      <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
    </button>
    <button id="fit" class="icon-btn" aria-label="Show whole map">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5 M20 9V4h-5 M4 15v5h5 M20 15v5h-5"/></svg>
    </button>
  </div>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden><span id="toast-text"></span><button id="toast-cancel" class="btn ghost">Cancel</button></div>

  <!-- bottom sheet (phone) / side panel (desktop) -->
  <aside id="sheet" class="sheet" aria-live="polite" hidden>
    <button id="sheet-handle" class="sheet-handle" aria-label="Expand or collapse"><span></span></button>
    <button id="sheet-close" class="icon-btn sheet-close" aria-label="Close">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="sheet-body" class="sheet-body"></div>
  </aside>
</section>

<script src="graph.js"></script>
<script src="app.js"></script>
</body>
</html>
