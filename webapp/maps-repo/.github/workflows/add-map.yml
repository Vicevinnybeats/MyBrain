# Started by the "+" button in the MyBrain app (and by its hourly refresh).
# Downloads one commit of a repository through the app (a signed 30-minute
# pass, so this repository needs no token), builds its code map (free, no AI)
# and adds it here. The app then rebuilds and shows it.
name: Add a map
run-name: "Map ${{ inputs.repo }}"

on:
  workflow_dispatch:
    inputs:
      repo:
        description: "GitHub repository, as owner/name"
        required: true
      sha:
        description: "Commit to map (filled in by the app)"
        required: true
      ts:
        description: "Pass time (filled in by the app)"
        required: true
      sig:
        description: "Pass signature (filled in by the app)"
        required: true

concurrency:
  group: add-map-${{ inputs.repo }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  APP_URL: ${{ vars.MYBRAIN_APP_URL || 'https://mybrain.vicevinnybeats.workers.dev' }}

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install MyBrain
        run: uv tool install "git+https://github.com/Vicevinnybeats/MyBrain"

      - name: Download the project
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
          TS: ${{ inputs.ts }}
          SIG: ${{ inputs.sig }}
        run: |
          case "$REPO" in
            */*/*|*..*|*[!A-Za-z0-9._/-]*) echo "::error::Not a repository name: $REPO"; exit 1;;
            */*) ;;
            *) echo "::error::Use owner/name"; exit 1;;
          esac
          mkdir project
          code=$(curl -sS -L -o project.tgz -w '%{http_code}' --get "$APP_URL/api/archive" \
            --data-urlencode "repo=$REPO" --data-urlencode "sha=$SHA" \
            --data-urlencode "ts=$TS" --data-urlencode "sig=$SIG")
          if [ "$code" != "200" ]; then
            echo "::error::The app refused the download (HTTP $code): $(head -c 300 project.tgz)"
            exit 1
          fi
          tar -xzf project.tgz -C project --strip-components=1
          rm project.tgz

      - name: Build the map (code only, free)
        run: cd project && mybrain update .

      - name: Publish
        env:
          REPO: ${{ inputs.repo }}
          SHA: ${{ inputs.sha }}
        run: |
          git config user.name "MyBrain"
          git config user.email "mybrain@users.noreply.github.com"
          NAME=$(printf '%s' "${REPO##*/}" | tr 'A-Z' 'a-z')
          MYBRAIN_MAPS_DIR="$PWD" mybrain-publish project --name "$NAME" --source "$REPO" --commit "$SHA"
