# Every hour: re-map each repository that got new commits since its map was
# made (maps added with the + button remember their repository). Free, no AI.
name: Refresh maps

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: maps-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install MyBrain
        run: uv tool install "git+https://github.com/Vicevinnybeats/MyBrain"

      - name: Refresh changed maps
        env:
          MYBRAIN_READ_TOKEN: ${{ secrets.MYBRAIN_READ_TOKEN }}
        run: |
          git config user.name "MyBrain"
          git config user.email "mybrain@users.noreply.github.com"
          python3 refresh.py

      - name: Save
        run: |
          git add maps
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "Refresh maps"
          for i in 1 2 3; do git push -q && exit 0; git pull -q --rebase; done
          exit 1
